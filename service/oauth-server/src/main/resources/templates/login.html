<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order System Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        /* Base styling */
        body {
            font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f4f7fb, #e9eff5);
        }

        /* Login container */
        .login-container {
            background: #ffffff;
            padding: 2.75rem 2.25rem;
            border-radius: 14px;
            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.08),
                0 2px 6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            border: 1px solid #eef1f5;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #1f2937;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* Error / Logout messages */
        .message {
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.4;
        }

        .error {
            color: #842029;
            background-color: #f8d7da;
            border: 1px solid #f5c2c7;
        }

        .logout {
            color: #0f5132;
            background-color: #d1e7dd;
            border: 1px solid #badbcc;
        }

        label {
            display: block;
            margin-top: 16px;
            color: #374151;
            font-size: 0.85rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 6px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #fafafa;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 26px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 0.4px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.35);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.25);
        }

        /* Responsive */
        @media (max-width: 400px) {
            .login-container {
                padding: 2.2rem 1.6rem;
                width: 92%;
            }

            h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Order System Login</h2>

    <!-- Error message -->
    <div th:if="${param.error != null}" class="message error">
        Invalid email or password.
    </div>

    <!-- Logout message -->
    <div th:if="${param.logout != null}" class="message logout">
        You have been logged out successfully.
    </div>

    <!-- Login form -->
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="username" placeholder="you@example.com" required autofocus/>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required/>

        <button type="submit">Sign In</button>
    </form>
</div>
</body>
</html>
