# ===================================================================
# API GATEWAY SERVICE
# ===================================================================

server:
  port: 9009
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - TokenRelay
      routes:
        # Shop Test
        - id: shop-test
          uri: lb://SHOP-SERVICE
          predicates:
            - Path=/test/**

        # Shop Service
        - id: shop-service
          uri: lb://SHOP-SERVICE
          predicates:
            - Path=/api/v1/bis/shops/**

        # Auth Service
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/bis/users/**

        #customer service
        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/bis/customers/**

        # order service
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/bis/orders/**

          #product
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/bis/products/**

            #catalogue service
        - id: catalogue-service
          uri: lb://CATALOGUE-SERVICE
          predicates:
            - Path=/api/v1/bis/catalogues/**

          #payment
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/bis/payments/**

  #  Auth
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

# Eureka Discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: gateway, health, info

# LOGGING FOR DEBUGGING ROUTES
logging:
  level:
    org.springframework.cloud.gateway: TRACE
