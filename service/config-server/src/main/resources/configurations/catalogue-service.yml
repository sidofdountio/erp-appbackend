# ===================================================================
# CATALOGUE SERVICE CONFIGURATION
# ===================================================================

server:
  port: 9005

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/cataloguedb
    username: sidof
    password: sidof1/@
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  #        FLYWAY
  flyway:
    baseline-on-migrate: true
    enable: true
    baseline-description: "init"
    baseline-version: 0
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  cloud:
    config:
      override.system-properties: false

  # Security (OAuth2)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  #KAFKA
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: catalogue-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"  # allow all packages
        spring.json.value.default.type: com.bis.app.kafka.ProductCreatedEvent
# Eureka Discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}