# ===================================================================
# API GATEWAY SERVICE - PRODUCTION PROFILE
# ===================================================================

server:
  port: 9009
  error:
    include-message: never # Security: Hide internal errors from public API

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - TokenRelay
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/bis/users/**

        - id: shop-service
          uri: lb://SHOP-SERVICE
          predicates:
            - Path=/api/v1/bis/shops/**

        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/bis/customers/**

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/bis/orders/**

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/bis/products/**

        - id: catalogue-service
          uri: lb://CATALOGUE-SERVICE
          predicates:
            - Path=/api/v1/bis/catalogues/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/bis/payments/**

# OAuth2 Security (The Gateway validates the JWT before forwarding)
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-service:9000

# Eureka Discovery
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health, info # 'gateway' and 'beans' removed for security in prod

# Performance Logging
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO # TRACE is too heavy for production