# ===================================================================
# ORDERS SERVICE
# ===================================================================

server:
  port: 9004

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/orderdb
    username: sidof
    password: sidof1/@
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  #        FLYWAY
  flyway:
    baseline-on-migrate: true
    enable: true
#    enabled: true
    baseline-description: "init"
    baseline-version: 0
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  cloud:
    config:
      override.system-properties: false

  # Security
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  #Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.type.mapping: orderConfirmation:com.bis.app.kafka.OrderConfirmation

# Eureka Discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# GATEWAY
application:
  config:
    customer-url: http://localhost:9009/api/v1/bis/customers
    product-url: http://localhost:9009/api/v1/bis/products
    payment-url: http://localhost:9009/api/v1/bis/payments
    catalogue-url: http://localhost:9009/api/v1/bis/catalogues
    shop-url: http://localhost:9009/api/v1/bis/public/shops
#    notification-url: http://localhost:9007/api/v1/bis/public/