server:
  port: 9001

spring:
  application:
    name: shops
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000


logging:
  level:
    root: INFO
    org.springframework.security: trace
